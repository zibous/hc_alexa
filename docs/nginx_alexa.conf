    # =============================================================================
    # locations/alexa.conf — Alexa Skills (Flash Briefings + Smart Home)
    # docker hc_alexa app:  http://localhost:5018 
    # uvicorn alexa_fastapi:main --host 0.0.0.0 --port 5018
    # =============================================================================

    # ----  Alexa briefings  -----
    location /api/alexa/flash_briefings/ {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect http:// https://;
        proxy_pass http://localhost:5018$request_uri;
    }
    # ----  Alexa Smarthome skill -----
    location /api/alexa/smart_home {
        allow all;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Authorization $http_authorization;
        proxy_redirect http:// https://;
        proxy_pass http://localhost:5018$request_uri;
    }

    location ^~ /dashboardalexa/ {
        access_log off;
        log_not_found off;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 60s;
        proxy_pass http://10.1.1.119:5018/;
    }
